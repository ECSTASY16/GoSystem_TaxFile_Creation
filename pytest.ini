[pytest]
testpaths = testcases
python_files = *Test.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    -s
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --capture=no
    --strict-markers
    --disable-warnings

markers =
    regression: Regression test suite
    smoke: Smoke test suite